name: Validate synthetic Sherlock case
on:
  push:
  pull_request:
jobs:
  case:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all Python modules compile
        run: python3 -m compileall -q tools tests
      - name: Regenerate synthetic multihost evidence and validate
        run: python3 tools/run_full_case.py
      - name: Verify 30 scientific question evidence contracts
        run: python3 tools/scientific_quality_gate.py
      - name: Execute forensic regression and negative-control tests
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild deterministic evidence after tests
        run: python3 tools/run_full_case.py
      - name: Build student-only release
        run: python3 tools/build_submission.py
      - name: Verify sealed release membership and hashes
        run: python3 tools/validate_release.py

      - name: Publish tested student-only archive
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: invisible-root-of-trust-student
          path: dist/Invisible-Root-of-Trust-student.zip
          if-no-files-found: error
          retention-days: 30
